name: Bot 2 Multi-Account Run

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 */6 * * *'  # Agar automatic chalana ho toh uncomment kar sakte ho

jobs:
  run-bot2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests gspread google-api-python-client google-auth

      - name: Run Bot 2
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          FB_TOKEN_1: ${{ secrets.FB_TOKEN_1 }}
          FB_TOKEN_2: ${{ secrets.FB_TOKEN_2 }}
        run: python bot2.py
        
