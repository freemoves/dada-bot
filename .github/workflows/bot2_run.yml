name: Bot 2 Multi-Account Run

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'  # Subah 9:00 AM IST (03:30 UTC)
    - cron: '30 6 * * *'  # Dopahar 12:00 PM IST (06:30 UTC)
    - cron: '0 9 * * *'   # Dopahar 2:30 PM IST (09:00 UTC)
    - cron: '30 12 * * *' # Sham 6:00 PM IST (12:30 UTC)
    - cron: '30 15 * * *' # Raat 9:00 PM IST (15:30 UTC)

jobs:
  run-bot2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests gspread google-api-python-client google-auth

      - name: Run Bot 2
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          FB_TOKEN_1: ${{ secrets.FB_TOKEN_1 }}
          FB_TOKEN_2: ${{ secrets.FB_TOKEN_2 }}
          FB_PAGE_ID_1: ${{ secrets.FB_PAGE_ID_1 }}
          FB_PAGE_ID_2: ${{ secrets.FB_PAGE_ID_2 }}
        run: python bot2.py
        
