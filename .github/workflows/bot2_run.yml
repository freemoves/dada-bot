name: Bot 2 Multi-Account Run

on:
  schedule:
    - cron: '30 3 * * *'  # Subah 9:00 AM IST
    - cron: '30 6 * * *'  # Dopahar 12:00 PM IST
    - cron: '0 9 * * *'   # Dopahar 2:30 PM IST
    - cron: '30 12 * * *' # Sham 6:00 PM IST
    - cron: '30 15 * * *' # Raat 9:00 PM IST
  workflow_dispatch:

jobs:
  run-bot2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-api-python-client google-auth

      - name: Run Bot 2
        env:
          MY_JSON: ${{ secrets.MY_JSON }}
          FB_TOKEN_1: ${{ secrets.FB_TOKEN_1 }}
          FB_TOKEN_2: ${{ secrets.FB_TOKEN_2 }}
        run: |
          python bot2.py
          
